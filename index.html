<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel ideal · Metrocasa</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* paleta Metrocasa (mesma do padrão executivo): vermelho = ação/1º lugar, vinho = estrutura,
   verde = único estado positivo. Nada decorativo. */
:root{
 --vinho:#5C0A10;--vermelho:#D3141C;--vermelho-d:#A80F16;--marca:#EC1C24;
 --rosa:#F8E8E9;--rosa-linha:#EFD2D4;
 --tinta:#1A1416;--grafite:#6B6065;--neutro:#EDE9EA;--papel:#FFFFFF;
 --ok:#1F7A5C;--ok-bg:#E6F2EC;--alerta:#9A5B00;
 --disp:'Space Grotesk',system-ui,sans-serif;
 --txt:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{font-size:clamp(16px,min(1.15vw,2.05vh),22px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--txt);font-size:1rem;line-height:1.5;color:var(--tinta);background:var(--papel);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}
.logo{height:1.375rem;width:auto;display:block}
.btn{border:0;border-radius:0.375rem;padding:0.8125rem 1.375rem;font-weight:600;font-size:0.9375rem;cursor:pointer;background:var(--vermelho);color:#fff;transition:background .15s}
.btn:hover:not(:disabled){background:var(--vermelho-d)}
.btn:disabled{background:var(--neutro);color:var(--grafite);cursor:not-allowed}
.btn-ghost{border:0;background:none;padding:0.8125rem 0.375rem;font-weight:600;font-size:0.9375rem;color:var(--grafite);cursor:pointer}
.btn-ghost:hover{color:var(--tinta)}
.btn-line{border:1.5px solid var(--rosa-linha);background:#fff;border-radius:0.375rem;padding:0.625rem 1rem;font-weight:600;font-size:0.875rem;cursor:pointer}
.btn-line:hover{border-color:var(--vinho)}

/* ===== login ===== */
.gate{min-height:100%;display:none;align-items:center;justify-content:center;padding:1.5rem 1rem;background:var(--rosa)}
.gate form{background:#fff;border-radius:0.625rem;padding:2.25rem 2rem;width:100%;max-width:25rem}
.gate h1{font-family:var(--disp);font-weight:600;font-size:1.75rem;letter-spacing:-.02em;line-height:1.15;margin:1.75rem 0 0.375rem}
.gate p{color:var(--grafite);margin:0 0 1.375rem;font-size:0.9375rem}
.gate label{display:block;font-size:0.875rem;font-weight:500;margin:0.875rem 0 0.375rem}
.gate input{width:100%;height:2.875rem;border:1.5px solid var(--neutro);border-radius:0.375rem;padding:0 0.75rem}
.gate input:focus{outline:none;border-color:var(--vinho)}
.gate .btn{width:100%;margin-top:1.5rem}
.gate-err{color:var(--vermelho-d);font-size:0.875rem;margin-top:0.75rem;min-height:1.2em}

/* ===== quiz ===== */
#quiz{position:fixed;inset:0;display:none;grid-template-columns:minmax(0,1fr) minmax(20rem,38%);background:var(--papel)}
#quiz.on{display:grid}
.q-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.5rem 3rem 0}
.q-count{font-size:0.875rem;color:var(--grafite)}
.q-count b{font-family:var(--disp);font-weight:600;color:var(--tinta)}
.q-track{display:none}
.q-body{flex:1;min-height:0;overflow-y:auto;padding:3rem 3rem 1.5rem}
.q-inner{max-width:45rem}
.q-title{font-family:var(--disp);font-weight:600;font-size:clamp(1.625rem,3.2vw,2.375rem);line-height:1.12;letter-spacing:-.02em;margin:0;max-width:22ch;outline:none}
.q-hint{color:var(--grafite);margin:0.625rem 0 1.75rem;font-size:0.9375rem;max-width:60ch}
.q-hint b{color:var(--tinta);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.opts.one{grid-template-columns:1fr;max-width:32.5rem}
.opts.tri{grid-template-columns:repeat(3,1fr)}
.opts.tri .opt{padding:0.625rem 2.25rem 0.625rem 0.625rem}
.opt{position:relative;display:flex;gap:0.875rem;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--neutro);border-radius:0.5rem;padding:0.875rem 2.5rem 0.875rem 0.875rem;cursor:pointer;transition:border-color .12s,background .12s}
/* ícone ilustrado: duotone em círculo pastel (fundo e traço do mesmo matiz) */
.ico{flex:none;width:2.875rem;height:2.875rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5625rem;background:var(--pb);color:var(--pc)}
.opts.tri .ico{width:2.375rem;height:2.375rem;font-size:1.3125rem}
.opt.sel .ico{box-shadow:0 0 0 2px #fff,0 0 0 0.2188rem var(--pc)}
.opt:hover{border-color:var(--rosa-linha)}
.opt.sel{border-color:var(--vermelho);background:var(--rosa)}
.opt.off{opacity:.4;pointer-events:none}
.opt .mk{position:absolute;top:0.75rem;right:0.75rem;width:1.125rem;height:1.125rem;border:1.5px solid #BDB4B7;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.opt.multi .mk{border-radius:0.25rem}
.opt.sel .mk{border-color:var(--vermelho);background:var(--vermelho)}
.opt.sel .mk::after{content:'';width:0.375rem;height:0.375rem;border-radius:50%;background:#fff}
.opt.multi.sel .mk::after{width:0.5625rem;height:0.3125rem;border-radius:0;background:none;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt .ot{display:block;font-weight:600;font-size:1rem;line-height:1.3}
.opt .od{display:block;color:var(--grafite);font-size:0.875rem;line-height:1.4;margin-top:0.1875rem}
.money{max-width:32.5rem}
.money input{width:100%;height:4.25rem;border:1.5px solid var(--neutro);border-radius:0.5rem;padding:0 1.125rem;font-family:var(--disp);font-weight:600;font-size:2rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.money input:focus{outline:none;border-color:var(--vermelho)}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.875rem}
.chips button{border:1.5px solid var(--neutro);background:#fff;border-radius:0.375rem;padding:0.5rem 0.875rem;font-weight:600;font-size:0.875rem;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button:hover{border-color:var(--rosa-linha)}
.q-dica{display:flex;gap:0.625rem;align-items:flex-start;margin:1.375rem 0 0;padding:0.75rem 0.875rem;border-radius:0.5rem;background:#F4F7F5;border:1px dashed #BFD6C8;font-size:0.875rem;color:#2F4A3C;max-width:40rem}
.q-dica i{font-size:1.375rem;color:#2A7F55;flex:none}
.q-dica b{font-weight:600}
.q-top .right{display:flex;align-items:center;gap:1rem}
.rot{border:0;background:none;font-size:0.8125rem;color:var(--grafite);cursor:pointer;display:flex;align-items:center;gap:0.375rem;padding:0.25rem 0}
.rot .sw{width:1.75rem;height:1rem;border-radius:0.5625rem;background:#CFC7CA;position:relative;transition:background .15s}
.rot .sw::after{content:'';position:absolute;top:2px;left:2px;width:0.75rem;height:0.75rem;border-radius:50%;background:#fff;transition:transform .15s}
.rot[aria-pressed="true"] .sw{background:#2A7F55}
.rot[aria-pressed="true"] .sw::after{transform:translateX(0.75rem)}
.chips .zero{border-style:dashed}
.chips .zero[aria-pressed="true"]{border-style:solid;border-color:var(--vermelho);background:var(--rosa)}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 3rem 1.5rem;border-top:1px solid var(--neutro)}
.q-foot .note{font-size:0.8125rem;color:var(--grafite);max-width:40ch}

/* prédio que sobe um andar por resposta */
.q-side{background:var(--rosa);display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 1.75rem 0;min-height:0;overflow:hidden}
.q-side svg{width:100%;height:auto;max-height:100%;display:block}
.fl-rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
.q-load{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(20rem,38%)}
.q-load .msg{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:3rem}
.q-load h2{font-family:var(--disp);font-weight:600;font-size:clamp(1.625rem,3vw,2.25rem);letter-spacing:-.02em;line-height:1.15;margin:0 0 0.625rem;max-width:20ch}
.q-load p{color:var(--grafite);margin:0}
.bar-ind{height:0.1875rem;background:var(--neutro);margin-top:1.75rem;width:100%;max-width:20rem;overflow:hidden;border-radius:2px}
.bar-ind i{display:block;height:100%;width:40%;background:var(--vermelho);animation:ind 1.1s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* ===== resultado ===== */
#result{display:none}
#result.on{display:block}
.r-wrap{max-width:85rem;margin:0 auto;padding:1.5rem 1.5rem 4.5rem}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:2.75rem}
.r-top .acts{display:flex;gap:0.5rem}
.r-h1{font-family:var(--disp);font-weight:600;font-size:clamp(1.75rem,4vw,2.75rem);line-height:1.08;letter-spacing:-.025em;margin:0;max-width:20ch}
.r-lead{color:var(--grafite);margin:0.875rem 0 0;font-size:1rem;max-width:72ch}
.perfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr));gap:1rem 1.75rem;margin:2rem 0 0;padding:1.25rem 0;border-top:1px solid var(--rosa-linha)}
.perfil dt{font-size:0.8125rem;color:var(--grafite)}
.perfil dd{margin:2px 0 0;font-weight:600;font-size:0.9375rem}
/* poder de compra: faixa vinho, a única área de cor sólida do resultado */
.poder{background:var(--vinho);color:#fff;border-radius:0.625rem;padding:1.375rem 1.5rem;display:grid;grid-template-columns:minmax(0,1.9fr) repeat(3,minmax(0,1fr));gap:1.125rem 1.75rem;align-items:end}
.poder h2{font-family:var(--disp);font-weight:600;font-size:0.9375rem;margin:0 0 0.375rem;opacity:.8}
.poder .big{font-family:var(--disp);font-weight:700;font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.poder .big span{white-space:nowrap}
.poder .big small{font-size:0.9375rem;font-weight:600;opacity:.8;margin:0 0.25rem}
.poder dt{font-size:0.8125rem;opacity:.75}
.poder dd{margin:2px 0 0;font-family:var(--disp);font-weight:600;font-size:1.125rem;font-variant-numeric:tabular-nums}
.poder p{grid-column:1/-1;margin:0;font-size:0.8125rem;opacity:.8;max-width:90ch}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(22.5rem,42%);gap:2rem;margin-top:1.75rem;align-items:start}
.mapbox{position:sticky;top:1rem;height:calc(100vh - 2rem);min-height:26.25rem;border-radius:0.625rem;overflow:hidden;background:var(--neutro)}
#map{position:absolute;inset:0}
.mapnote{position:absolute;left:0.625rem;bottom:0.625rem;z-index:500;background:#fff;border-radius:0.375rem;padding:0.375rem 0.625rem;font-size:0.75rem;color:var(--grafite);box-shadow:0 1px 0.25rem rgba(26,20,22,.15);max-width:calc(100% - 1.25rem)}
.leaflet-container{font-family:var(--txt)}
.leaflet-popup-content{margin:0.75rem 0.875rem;font-size:0.8125rem;line-height:1.45}
.leaflet-popup-content b{font-family:var(--disp);font-size:0.9375rem;display:block;margin-bottom:2px}
.pin-tip{font-family:var(--disp);font-weight:600;font-size:0.75rem}
.filtro{display:flex;flex-wrap:wrap;gap:0.375rem;margin:0 0 0.375rem}
.filtro button{border:1.5px solid var(--neutro);background:#fff;border-radius:0.375rem;padding:0.4375rem 0.75rem;font-size:0.875rem;font-weight:500;cursor:pointer}
.filtro button[aria-pressed="true"]{border-color:var(--vinho);background:var(--vinho);color:#fff}
.filtro .n{font-family:var(--disp);font-variant-numeric:tabular-nums;opacity:.7;margin-left:0.25rem}
.listnote{font-size:0.8125rem;color:var(--grafite);margin:0.625rem 0 0.25rem}
.rank{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:2.25rem minmax(0,1fr) 5.75rem;grid-template-areas:"pos name pct" "pos meta pct" "pos buy buy" "pos pitch pitch" "pos why why";gap:2px 1rem;padding:1rem 0.5rem 1rem 0;border-bottom:1px solid var(--neutro);align-items:center;cursor:pointer;transition:background .12s}
.row:hover,.row.on{background:#FCF6F6}
.pos{grid-area:pos;align-self:start;width:1.875rem;height:1.875rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;font-size:0.875rem;border:1.5px solid var(--neutro);color:var(--grafite);font-variant-numeric:tabular-nums;margin-left:0.25rem}
.row:nth-child(1) .pos{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.row:nth-child(2) .pos,.row:nth-child(3) .pos{background:var(--vinho);border-color:var(--vinho);color:#fff}
.name{grid-area:name;font-family:var(--disp);font-weight:600;font-size:1.125rem;letter-spacing:-.01em;line-height:1.2}
.meta{grid-area:meta;color:var(--grafite);font-size:0.875rem}
.buy{grid-area:buy;display:flex;flex-wrap:wrap;align-items:baseline;gap:0.25rem 0.75rem;margin-top:0.375rem}
.buy .price{font-family:var(--disp);font-weight:600;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.buy .fit{font-size:0.8125rem;font-weight:600}
.fit.ok{color:var(--ok)} .fit.lim{color:var(--alerta)} .fit.no{color:var(--vermelho-d)}
.pct{grid-area:pct;text-align:right}
.pct .v{font-family:var(--disp);font-weight:700;font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums}
.pct .v small{font-size:0.8125rem;font-weight:600;margin-left:1px}
.pct .t{height:0.25rem;background:var(--neutro);border-radius:2px;margin-top:0.5rem;overflow:hidden}
.pct .t i{display:block;height:100%;margin-left:auto}
.hi .v{color:var(--ok)} .hi .t i{background:var(--ok)}
.md .v{color:var(--vinho)} .md .t i{background:var(--vinho)}
.lo .v{color:var(--grafite)} .lo .t i{background:#B9AFB2}
.why{grid-area:why;display:flex;flex-wrap:wrap;gap:2px 0.875rem;margin-top:0.375rem;font-size:0.8125rem}
.why span{color:var(--grafite)}
.why .ok{color:var(--ok)}
.why .ok::before{content:'✓ ';font-weight:700}
/* 3 escolhas */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.875rem;margin:2rem 0 1.75rem}
.pick{position:relative;text-align:left;background:#fff;border:1.5px solid var(--neutro);border-radius:0.625rem;padding:1.125rem 1.125rem 1rem;cursor:pointer;display:flex;flex-direction:column;gap:0.375rem;transition:border-color .12s}
.pick:hover{border-color:var(--rosa-linha)}
.pick.rec{border:2px solid var(--vermelho)}
.pick .lab{display:flex;align-items:center;gap:0.5rem;font-weight:600;font-size:0.875rem}
.pick .lab .ico{width:2.125rem;height:2.125rem;font-size:1.1875rem}
.pick .nm{font-family:var(--disp);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2;margin-top:0.375rem}
.pick .mt{font-size:0.875rem;color:var(--grafite)}
.pick .pr{display:flex;align-items:baseline;justify-content:space-between;gap:0.625rem;margin-top:0.375rem}
.pick .pr b{font-family:var(--disp);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.pick .pr span{font-family:var(--disp);font-weight:700;font-size:1.125rem}
.pick .dl{font-size:0.8125rem;color:var(--vinho);font-weight:600}
.pitch{grid-area:pitch;display:flex;flex-direction:column;gap:0.1875rem;margin-top:0.5rem}
.pitch span{display:flex;gap:0.4375rem;align-items:flex-start;font-size:0.875rem;color:var(--vinho);font-weight:500;line-height:1.35}
.pitch i{font-size:1.0625rem;flex:none;margin-top:1px}
.pick .pitch{margin-top:0.25rem}
.poder .cmp{grid-column:1/-1;background:rgba(255,255,255,.1);border-radius:0.5rem;padding:0.75rem 0.875rem;font-size:0.9375rem;line-height:1.5}
.poder .cmp b{font-family:var(--disp);font-weight:600}
.btn-wa{border:0;background:#1F7A5C;color:#fff;border-radius:0.375rem;padding:0.625rem 1rem;font-weight:600;font-size:0.875rem;cursor:pointer;display:flex;align-items:center;gap:0.375rem}
.btn-wa:hover{background:#17614A}
.btn-wa i{font-size:1.125rem}
@media (max-width:860px){.picks{grid-template-columns:1fr}}
.empty{padding:2.5rem 0;color:var(--grafite);max-width:52ch}
.empty b{display:block;color:var(--tinta);font-family:var(--disp);font-size:1.25rem;font-weight:600;margin-bottom:0.375rem}
.metodo{margin-top:2.5rem;font-size:0.8125rem;color:var(--grafite);max-width:80ch;line-height:1.6}

@media (max-width:1100px){
 .split{grid-template-columns:1fr}
 .mapbox{position:relative;top:0;height:21.25rem;min-height:0;order:-1}
 .poder{grid-template-columns:1fr 1fr}
 .poder > div:first-child{grid-column:1/-1}
}
@media (max-width:860px){
 #quiz{grid-template-columns:1fr}
 .q-side{display:none}
 .q-top{padding:1rem 1rem 0}
 .q-track{display:flex;gap:0.25rem;padding:0.75rem 1rem 0}
 .q-track i{flex:1;height:0.25rem;border-radius:2px;background:var(--neutro)}
 .q-track i.done{background:var(--vinho)}
 .q-track i.now{background:var(--vermelho)}
 .q-body{padding:1.75rem 1rem 1rem}
 .opts,.opts.tri{grid-template-columns:1fr 1fr}
 .q-foot{padding:0.75rem 1rem 1rem}
 .q-foot .note{display:none}
 .q-load{grid-template-columns:1fr}
 .q-load .q-side{display:none}
 .r-wrap{padding:1rem 1rem 3.5rem}
 .r-top{margin-bottom:1.75rem}
 .mapbox{height:17.5rem}
}
@media (max-width:520px){
 .opts,.opts.tri{grid-template-columns:1fr}
 .money input{font-size:1.625rem;height:3.75rem}
 .r-top .acts .btn-line:first-child{display:none}
 .poder{grid-template-columns:1fr}
 .row{grid-template-columns:2.125rem minmax(0,1fr) 4.375rem;gap:2px 0.625rem}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== navegação ===== */
.logo-btn{border:0;background:none;padding:0;cursor:pointer;display:block}
.logo-btn:hover .logo{opacity:.8}
/* quiz: conteúdo centralizado na vertical quando cabe */
.q-body{display:flex;flex-direction:column}
.q-inner{margin:auto 0;width:100%}
.q-foot .btns{display:flex;gap:.6rem;align-items:center}
.q-side{cursor:default}
.fl-go{cursor:pointer}
.fl-go:hover .fl-body,.fl-go:focus-visible .fl-body{filter:brightness(1.25)}
.fl-go:focus{outline:none}
.fl-go:focus-visible .fl-body{stroke:#D3141C;stroke-width:3}

/* ===== resultado em 2 colunas: conteúdo rola, mapa fixo à direita ===== */
.r-app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);min-height:100vh}
.r-left{min-width:0;padding:1.25rem 2rem 3rem}
.r-map{position:sticky;top:0;height:100vh;background:#C9C3C5}
.r-map #map{position:absolute;inset:0;background:#C9C3C5}
.r-top{margin-bottom:1.75rem}
.r-h1{font-size:clamp(1.6rem,2.3vw,2.4rem);max-width:24ch}
.r-lead{font-size:.95rem;margin-top:.5rem}
.pchips{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.1rem 0 0}
.pchip{border:1px solid var(--neutro);background:#fff;border-radius:999px;padding:.3rem .75rem;font-size:.82rem;cursor:pointer;display:flex;gap:.35rem;align-items:baseline}
.pchip span{color:var(--grafite)}
.pchip b{font-weight:600}
.pchip:hover{border-color:var(--vinho)}
.picks{grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));margin:1.5rem 0 1.25rem}
.poder{grid-template-columns:auto repeat(3,minmax(0,1fr));padding:1rem 1.25rem;gap:.6rem 1.5rem;align-items:center}
.poder h2{font-size:.8rem;margin:0 0 .2rem}
.poder .big{font-size:clamp(1.3rem,1.8vw,1.9rem)}
.poder dt{font-size:.75rem}
.poder dd{font-size:1rem}
.poder .cmp{font-size:.88rem;padding:.6rem .8rem}
.lista{margin-top:1.5rem}
.row{padding:.85rem .5rem .85rem 0}
.name{font-size:1.05rem}
.why{font-size:.78rem}
.metodo{margin-top:2rem;font-size:.78rem}
.leaflet-container{background:#C9C3C5}
@media (max-width:1100px){
 .r-app{display:flex;flex-direction:column}
 .r-map{position:relative;height:320px;order:-1}
 .r-left{padding:1rem 1rem 3rem}
 .poder{grid-template-columns:1fr 1fr}
 .poder > div:first-child{grid-column:1/-1}
}

/* prédio: gancho da grua balança de leve; laje nova desce */
.hook{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.q-side{padding:1.5rem 1.25rem 0}
</style>
</head>

 <form onsubmit="return doLogin(event)">
  <img class="logo" id="gatelogo" alt="Metrocasa">

  <p>Entre com a mesma conta do Motor de Cálculo para consultar o estoque.</p>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" id="gatebtn">Entrar</button>
  <div class="gate-err" id="gateerr" role="alert"></div>
 </form>
</div>

/* ===== poder de compra estimado (aproximação do fluxo do Motor, sem montar o fluxo) =====
   financiamento CAIXA máx. da faixa de renda (FIN) + subsídio (com dependente se "família com filhos")
   + mensais pré-chaves (15% da renda até R$4.500, 20% acima) × meses até a entrega
   + anuais pré-chaves (100% da renda por ano cheio até a entrega)
   + pós-chaves: menor entre % do valor da unidade e 10% da renda × prazo (studio/1D 20%·48m, 1D+office 20%·60m, 2D 25%·60m).
   sem data de entrega cadastrada, assume 24 meses. */
function mesesAte(iso){if(!iso)return 24;var p=String(iso).split('-');if(p.length<2)return 24;
 var d=new Date(+p[0],(+p[1]||1)-1,1),n=new Date();return Math.max(0,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth())}
function poderBase(){var renda=cur(ANS.renda),f=finLookup(renda),dep=/filhos/i.test(ANS.composicao||'');
 return{renda:renda,f:f,fin:f.maxCom,sub:dep?f.subC:f.subS,dep:dep,mensal:r2(renda*(renda>RULES.compCorte?RULES.compAcima:RULES.compAbaixo)/100)}}
function poderUnidade(P,u,k){var valor=+u.valor_tabela||0,m=mesesAte(ENT_IDX[u.empreendimento]);
 var pre=P.mensal*m+P.renda*(RULES.anuMultBase/100)*Math.floor(m/12);
 var pr=RULES.pos[k]||RULES.pos.resto,pos=Math.min(valor*pr.pct/100,P.renda*(RULES.posPctRenda/100)*pr.meses);
 /* parcela depois das chaves ≈ parcela CAIXA proporcional ao valor financiado + pós-chaves mensal */
 var finUsado=Math.min(P.fin,Math.max(0,valor-P.sub-pre-pos)),parcFin=P.f.maxCom?P.f.parcela*finUsado/P.f.maxCom:0,posMes=pr.meses?pos/pr.meses:0;
 return{total:r2(P.fin+P.sub+pre+pos),pre:r2(pre),pos:r2(pos),meses:m,entregaConhecida:!!ENT_IDX[u.empreendimento],
  parcFin:r2(parcFin),posMes:r2(posMes),depois:r2(parcFin+posMes)}}

/* ===== compatibilidade — nota absoluta 0-100 =====
   planta 30 · cabe no bolso 25 · região 20 · prioridade 10 · quem vai morar 8 · deslocamento 7.
   unidades de categoria fora da faixa de renda (HIS-1/HIS-2) saem da lista.
   lazer/diferenciais ainda não têm dado por empreendimento na base → não pontuam. */
var METRO_ZONES=['ZONA LESTE','ZONA SUL','CENTRO'];
function tipKind(t){t=snorm(t);
 if(t.indexOf('STUDIO')>=0||t.indexOf('STD')>=0)return'studio';
 if(/(^|\D)2\s*D|2\s*DORM/.test(t))return'2d';
 if(t.indexOf('OFFICE')>=0)return'1do';
 if(/(^|\D)1\s*D|1\s*DORM/.test(t))return'1d';

var TIP_ORD=['studio','1d','1do','2d','outro'];
var TIP_LBL={studio:'Studio','1d':'1 dormitório','1do':'1 dorm. + office','2d':'2 dormitórios',outro:'Especiais'};
var TIP_PTS={
 'Studio':{studio:30,'1d':13,'1do':9,'2d':0,outro:4},
 '1 dormitório':{studio:10,'1d':30,'1do':26,'2d':10,outro:4},
 '2 dormitórios':{studio:0,'1d':7,'1do':19,'2d':30,outro:4}};
function compPts(comp,k){var t;
 if(/sozinho|pet/i.test(comp))t={studio:8,'1d':8,'1do':6,'2d':4,outro:4};
 else if(/parceiro/i.test(comp))t={studio:4,'1d':8,'1do':8,'2d':6,outro:4};
 else if(/filhos|familiares/i.test(comp))t={studio:0,'1d':2,'1do':5,'2d':8,outro:4};
 else return 4;

function regOfU(u){return u.regiao||REG_IDX[u.empreendimento]||''}
function percentil(sorted,v){if(sorted.length<2)return .5;var lo=0,hi=sorted.length;while(lo<hi){var m=(lo+hi)>>1;if(sorted[m]<v)lo=m+1;else hi=m}return lo/(sorted.length-1)}
/* número do andar+apto a partir do código da unidade ("U-0104" → 104, "2-0501" → 501, "1-0003 NR" → 3):
   último grupo de 3+ dígitos; quanto maior, mais alto o andar */
function andarDe(unid){var m=String(unid||'').match(/\d{3,}/g);return m?parseInt(m[m.length-1],10):-1}
function cap(s){s=String(s||'').toLowerCase();return s.replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}

/* empreendimentos no estoque que ainda não foram lançados — não entram na recomendação (tirar daqui quando lançar) */
var NAO_LANCADOS=['CLUBE GUARAPIRANGA - MODULO II','CLUBE VILA DAS BELEZAS - MODULO II'];

function pontuar(){

 /* vagas de garagem não são moradia, e empreendimentos ainda não lançados: ficam fora da recomendação */
 var U=(UNITS||[]).filter(function(u){return !/VAGA/.test(snorm(u.tipologia))&&NAO_LANCADOS.indexOf(snorm(u.empreendimento))<0}),elig=catElegiveis(PB.renda);
 var regs=(ANS.regioes||[]).filter(function(r){return r!=='Indiferente'}).map(snorm),useReg=regs.length>0;
 var desl=(ANS.deslocamento||'').toLowerCase(),querTransp=/metr|nibus|perto/.test(desl),prio=ANS.prioridade||'';
 AVALIADAS=U.length;
 U=U.filter(function(u){var c=((u.categoria||'')+'').toUpperCase().trim();return !c||elig[c]});
 FORA_FAIXA=AVALIADAS-U.length;
 /* diagnóstico: nomes de tipologia do estoque que não caíram em studio/1D/1D+office/2D */

 SCORED=U.map(function(u){
  var k=tipKind(u.tipologia),rg=regOfU(u),rgN=snorm(rg),why=[],s=0,p;

  else fit=['no','Acima: faltam '+mil(valor-pw.total)];
  /* região */
  if(!useReg)s+=20;
  else if(!rg){s+=8;why.push(['','Região não informada'])}
  else if(regs.indexOf(rgN)>=0){s+=20;why.push(['ok','Região escolhida'])}

 SCORED.sort(function(a,b){
  if(b.pct!==a.pct)return b.pct-a.pct;

 var grupo={};SCORED.forEach(function(x){var key=snorm(x.u.empreendimento)+'|'+snorm(x.u.tipologia)+'|'+(x.u.area_total==null?'':Math.floor(+x.u.area_total));
  var gr=grupo[key]=grupo[key]||{best:null,n:0};gr.n++;if(!gr.best||andarDe(x.u.unidade)>andarDe(gr.best.u.unidade))gr.best=x});
 var UNICAS=[];SCORED.forEach(function(x){var key=snorm(x.u.empreendimento)+'|'+snorm(x.u.tipologia)+'|'+(x.u.area_total==null?'':Math.floor(+x.u.area_total));
  if(grupo[key].best===x){x.iguais=grupo[key].n-1;UNICAS.push(x)}});

 TOPS={};TIP_ORD.forEach(function(k){var porEmp={},out=[];
  for(var i=0;i<UNICAS.length&&out.length<TOP_POR_PLANTA;i++){var x=UNICAS[i];if(x.k!==k)continue;

  if(out.length)TOPS[k]=out});
 /* 3 escolhas p/ induzir a decisão: a recomendada + uma mais barata e uma maior, com nota parecida */
 PICKS=[];var rec=UNICAS[0];
 if(rec){PICKS.push({tipo:'rec',x:rec});
  var usados=[rec],vRec=+rec.u.valor_tabela||0,aRec=+rec.u.area_total||0;

  var faixa=function(margem,cond){return UNICAS.filter(function(x){return x.pct>=rec.pct-margem&&cond(x)})};
  var porValor=function(a,b){return (+a.u.valor_tabela||0)-(+b.u.valor_tabela||0)},porArea=function(a,b){return (+b.u.area_total||0)-(+a.u.area_total||0)};
  var cEco=function(x){return x.fit[0]==='ok'&&(+x.u.valor_tabela||0)<=vRec*.95},cEsp=function(x){return x.fit[0]!=='no'&&(+x.u.area_total||0)>=aRec+1};
  var eco=melhor(faixa(12,cEco),porValor)||melhor(faixa(25,cEco),porValor);
  if(eco){PICKS.push({tipo:'eco',x:eco});usados.push(eco)}
  var esp=melhor(faixa(12,cEsp),porArea)||melhor(faixa(25,cEsp),porArea);

function corNivel(p){return p>=80?'#1F7A5C':p>=60?'#5C0A10':'#8F8589'}
function desenharMapa(list){
 if(MAP){MAP.remove();MAP=null}PINS={};
 if(!window.L){g('mapnote').hidden=false;g('mapnote').textContent='O mapa não carregou. Verifique a internet.';return}
 var cidade=L.latLngBounds(SP_LIMITE);
 MAP=L.map('map',{scrollWheelZoom:true,zoomControl:true,attributionControl:true,minZoom:9,maxZoom:16,maxBounds:cidade.pad(.35),maxBoundsViscosity:.8,zoomSnap:.25});
 MAP.attributionControl.setPrefix(false).addAttribution('Limite municipal: IBGE');
 /* ruas: base cinza-clara da Esri + camada de nomes; fora do município uma máscara cinza-escura cobre tudo */
 var base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap'}).addTo(MAP),erros=0;
 base.on('tileerror',function(){if(++erros===4){MAP.removeLayer(base);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP).bringToBack()}});
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,minZoom:12}).addTo(MAP);
 var mundo=[[-90,-180],[-90,180],[90,180],[90,-180]];
 L.polygon([mundo,SP_LIMITE],{stroke:false,fillColor:'#8F8589',fillOpacity:.45,interactive:false}).addTo(MAP);
 L.polyline(SP_LIMITE.concat([SP_LIMITE[0]]),{color:'#6B6065',weight:1.5,interactive:false}).addTo(MAP);
 var grupos={},semGeo={};
 list.forEach(function(x,i){var k=snorm(x.u.empreendimento),geo=geoOf(x.u.empreendimento);
  if(!geo||geo.lat==null){semGeo[k]=1;return}
  var gr=grupos[k]=grupos[k]||{nome:x.u.empreendimento,geo:geo,itens:[],melhor:0,pos:i+1};
  gr.itens.push(x);gr.melhor=Math.max(gr.melhor,x.pct)});
 Object.keys(grupos).forEach(function(k){var gr=grupos[k],ll=[gr.geo.lat,gr.geo.lng];
  var m=L.circleMarker(ll,{radius:gr.pos<=3?10:7,color:'#fff',weight:2,fillColor:gr.pos===1?'#D3141C':corNivel(gr.melhor),fillOpacity:1})
   .addTo(MAP)
   .bindTooltip(esc(gr.nome),{direction:'top',offset:[0,-8],className:'pin-tip'})
   .bindPopup('<b>'+esc(gr.nome)+'</b>'+esc(gr.geo.end||'')+'<br>Até '+gr.melhor+'% compatível'+(gr.geo.prec==='bairro'?'<br><i>Localização aproximada pelo bairro.</i>':''));
  m.on('click',function(){marcarLinhas(k,true)});
  PINS[k]=m});
 var ns=Object.keys(semGeo).length;
 if(ns){g('mapnote').hidden=false;g('mapnote').textContent=(ns===1?'Um empreendimento da lista está':'Alguns empreendimentos da lista estão')+' sem endereço cadastrado e não aparecem no mapa.'}
 setTimeout(function(){if(!MAP)return;MAP.invalidateSize();MAP.fitBounds(cidade,{padding:[16,16]})},60)}
function marcarLinhas(k,rolar){var first=null;
 g('result').querySelectorAll('.row').forEach(function(r){var on=r.getAttribute('data-emp')===k;r.classList.toggle('on',on);if(on&&!first)first=r});
 if(rolar&&first)first.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'})}
function focarPino(k){var m=PINS[k];marcarLinhas(k,false);if(!m||!MAP)return;
 MAP.setView(m.getLatLng(),Math.max(MAP.getZoom(),14),{animate:!REDUCED});m.openPopup()}
g('result').addEventListener('click',function(e){
 var c=e.target.closest('.filtro button');if(c){FILTRO=c.getAttribute('data-f');renderResult();return}
 var pc=e.target.closest('.pchip');if(pc){irPara(+pc.getAttribute('data-step'));return}
 var r=e.target.closest('.row,.pick');if(r)focarPino(r.getAttribute('data-emp'))});
g('result').addEventListener('keydown',function(e){var r=e.target.closest&&e.target.closest('.row');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();focarPino(r.getAttribute('data-emp'))}});

function copiarLista(){var list=listaAtual();
 var txt=list.map(function(x,i){var u=x.u;return (i+1)+'. '+u.empreendimento+', unidade '+u.unidade+', '+(u.tipologia||'—')+', '+(u.valor_tabela!=null?brl(u.valor_tabela):'—')+' ('+x.pct+'% compatível, '+x.fit[1].toLowerCase()+')'}).join('\n');
 navigator.clipboard.writeText(txt).then(function(){alert('Lista copiada.')},function(){prompt('Copie a lista:',txt)})}
